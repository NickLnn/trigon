# Keeps dependencies, pinned base-image digests and pinned action SHAs up to date through reviewed PRs
# against dev (nothing is updated without a pull request).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule: { interval: weekly }
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directories: [/apps/api, /apps/web]
    target-branch: dev
    schedule: { interval: weekly }
  - package-ecosystem: docker-compose
    directory: /
    target-branch: dev
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule: { interval: weekly }
