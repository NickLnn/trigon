# Trigon — full stack using the prebuilt images GitHub Actions publishes to ghcr.io.
#
#   Run / update (e.g. on the Synology):   docker compose pull && docker compose up -d
#   Update automatically instead:          set COMPOSE_PROFILES=autoupdate in .env, then docker compose up -d
#   Only the databases (local development, ports on 127.0.0.1):
#     docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d postgres redis
#   Build the app images from source instead:
#     docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# TRIGON_TAG in .env picks the channel: latest (main branch, stable) or dev (dev branch).
#
# Only the web port is published. Postgres, Redis and the live-editing server are reachable inside this
# project's network only (the web container forwards /collab), so nothing else on the LAN can talk to them.
name: trigon

services:
  postgres:
    container_name: trigon-postgres
    image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trigon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-trigon}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    container_name: trigon-redis
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped
    # Password-protected when REDIS_PASSWORD is set in .env (recommended).
    command: redis-server --appendonly yes --protected-mode yes ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-}
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    container_name: trigon-api
    # A tiny init (tini) as PID 1 reaps any orphaned child processes, so zombies can never pile up.
    init: true
    image: ghcr.io/nicklnn/trigon-api:${TRIGON_TAG:-latest}
    restart: unless-stopped
    # Runs as the unprivileged "node" user; needs no Linux capabilities and may never gain any.
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    labels: &autoupdate
      com.centurylinklabs.watchtower.enable: 'true'
      com.centurylinklabs.watchtower.scope: trigon
    env_file: .env
    environment:
      # Discrete PG* vars instead of a URL, so the password needs no URL-escaping.
      DATABASE_URL: ''
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-trigon}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-trigon}
      REDIS_URL: redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD}@}redis:6379
      API_PORT: 4000
      COLLAB_PORT: 4001
      STORAGE_DIR: /data/storage
    volumes:
      - ./data/storage:/data/storage
      # Settings → Backups → "This server" writes here (keep it on a different disk if you can).
      - ./data/backups:/data/backups
      # Extra OCR languages: drop <code>.traineddata files here (English + Greek are built in). See docs/ocr-languages.md.
      - ./data/tessdata:/data/tessdata:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    container_name: trigon-web
    init: true
    image: ghcr.io/nicklnn/trigon-web:${TRIGON_TAG:-latest}
    restart: unless-stopped
    # Runs as the unprivileged "node" user; needs no Linux capabilities and may never gain any.
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    labels: *autoupdate
    environment:
      # Reverse proxies on other machines whose forwarded client address the audit log may believe
      # (Docker networks and loopback are trusted already), e.g. 192.168.xxx.xxx or a /24 range.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      - api

  # Optional automatic updates (COMPOSE_PROFILES=autoupdate in .env): checks GitHub's registry for new
  # trigon-api / trigon-web images and restarts them on the new version. Only containers labelled with
  # the "trigon" scope are touched — never the databases, nor anything else running on the host.
  updater:
    container_name: trigon-updater
    image: nickfedor/watchtower:latest
    profiles: [autoupdate]
    restart: unless-stopped
    # Keeps itself current too (it publishes no port, so Watchtower can replace its own container).
    labels: *autoupdate
    environment:
      WATCHTOWER_SCOPE: trigon
      WATCHTOWER_LABEL_ENABLE: 'true'
      WATCHTOWER_POLL_INTERVAL: ${TRIGON_UPDATE_INTERVAL:-900}
      WATCHTOWER_CLEANUP: 'true'
      TZ: ${TZ:-UTC}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
