# Trigon — full stack using the prebuilt images GitHub Actions publishes to ghcr.io.
#
#   Run / update (e.g. on the Synology):   docker compose pull && docker compose up -d
#   Update automatically instead:          set COMPOSE_PROFILES=autoupdate in .env, then docker compose up -d
#   Only the databases (local development): docker compose up -d postgres redis
#   Build the app images from source instead:
#     docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# TRIGON_TAG in .env picks the channel: latest (main branch, stable) or dev (dev branch).
name: trigon

services:
  postgres:
    container_name: trigon-postgres
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trigon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-trigon}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    container_name: trigon-redis
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - ./data/redis:/data
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    container_name: trigon-api
    image: ghcr.io/nicklnn/trigon-api:${TRIGON_TAG:-latest}
    restart: unless-stopped
    labels: &autoupdate
      com.centurylinklabs.watchtower.enable: 'true'
      com.centurylinklabs.watchtower.scope: trigon
    env_file: .env
    environment:
      # Discrete PG* vars instead of a URL, so the password needs no URL-escaping.
      DATABASE_URL: ''
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-trigon}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-trigon}
      REDIS_URL: redis://redis:6379
      API_PORT: 4000
      COLLAB_PORT: 4001
      STORAGE_DIR: /data/storage
    volumes:
      - ./data/storage:/data/storage
    ports:
      - '${COLLAB_PORT:-4001}:4001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    container_name: trigon-web
    image: ghcr.io/nicklnn/trigon-web:${TRIGON_TAG:-latest}
    restart: unless-stopped
    labels: *autoupdate
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      - api

  # Optional automatic updates (COMPOSE_PROFILES=autoupdate in .env): checks GitHub's registry for new
  # trigon-api / trigon-web images and restarts them on the new version. Only containers labelled with
  # the "trigon" scope are touched — never the databases, nor anything else running on the host.
  updater:
    container_name: trigon-updater
    image: nickfedor/watchtower:1.23
    profiles: [autoupdate]
    restart: unless-stopped
    environment:
      WATCHTOWER_SCOPE: trigon
      WATCHTOWER_LABEL_ENABLE: 'true'
      WATCHTOWER_POLL_INTERVAL: ${TRIGON_UPDATE_INTERVAL:-900}
      WATCHTOWER_CLEANUP: 'true'
      TZ: ${TZ:-UTC}
    labels:
      com.centurylinklabs.watchtower.scope: trigon
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
